name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    env:
      SMARTCUT_CI: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          echo "C:\ProgramData\chocolatey\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:Path = "C:\ProgramData\chocolatey\bin;$env:Path"
          ffmpeg -version
          ffprobe -version

      - name: Install project
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,desktop,transcribe,vision,server]"

      - name: Run tests
        shell: pwsh
        run: python -m pytest -q

      - name: Evaluate rule planner selection
        shell: pwsh
        run: python -m pytest -q -m eval

      - name: Check policy drift
        shell: pwsh
        run: python scripts/check_drift.py

      - name: Desktop smoke test
        shell: pwsh
        run: python -m smartcut.desktop.app --smoke-test --data-dir "$env:TEMP\smartcut-smoke"
